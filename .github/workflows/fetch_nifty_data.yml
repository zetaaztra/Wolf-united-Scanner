name: Fetch Nifty 500 Data

on:
  schedule:
    - cron: '30 5 * * *'  # 11:00 AM IST
    - cron: '0 10 * * *'  # 3:30 PM IST
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance requests

      - name: Fetch Data
        run: python scripts/fetch_nifty_data.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/nifty500_ohlcv.csv data/metadata.json
          git diff --quiet && git diff --staged --quiet || (git pull --rebase origin main && git commit -m "Automated Data Update: $(date +'%Y-%m-%d %H:%M')" && git push)
